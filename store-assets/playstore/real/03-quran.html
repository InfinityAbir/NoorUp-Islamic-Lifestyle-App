<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{background:#111;font-family:'Hind Siliguri',sans-serif}
.shot{width:1080px;height:1920px;background:radial-gradient(900px 500px at 15% 0%,#e8f3fd 0%,transparent 60%),radial-gradient(900px 500px at 90% 10%,#e6f6ee 0%,transparent 60%),#f5faf7;display:flex;flex-direction:column;align-items:center;overflow:hidden;position:relative}
.pill{margin-top:80px;background:#d8efe2;color:#0a6b47;font-weight:700;font-size:30px;padding:14px 38px;border-radius:100px;letter-spacing:.2px}
h1{font-family:'Noto Serif Bengali','Hind Siliguri',sans-serif;font-weight:900;font-size:96px;line-height:1.18;color:#101815;text-align:center;margin:26px 40px 0;white-space:nowrap}
h1 .g{color:#0b7a55}
.sub{color:#6b7280;font-size:37px;font-weight:500;margin-top:22px;text-align:center;white-space:nowrap}
.phone{margin-top:56px;width:664px;height:1385px;border:12px solid #0f1a14;border-radius:64px;background:#0b0f1a;overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.22)}
.phone img{display:block;width:640px;height:1361px;object-fit:cover;object-position:top}
.wg{flex:1;display:flex;flex-direction:column;justify-content:center;gap:56px;align-items:center;padding-bottom:70px}
.wg img{display:block;width:970px;border-radius:64px;box-shadow:0 24px 60px rgba(0,0,0,.28);border:1px solid rgba(11,122,85,.35)}
</style></head><body>
<div class="shot">
<div class="pill">আল-কুরআন</div>
<h1>বাংলায় <span class=g>কুরআন</span> পড়ুন</h1>
<div class="sub">সূরা তালিকা • তিলাওয়াত • হিফজ ট্র্যাকার</div>
<div class="phone"><img src="screens/quran.png"></div>
</div></body></html>
